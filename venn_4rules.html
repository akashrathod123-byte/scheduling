<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SLV Rules — 4 Circle Venn</title>
<style>
  :root {
    --ink:       #1a1a1a;
    --ink-2:     #4a4a4a;
    --muted:     #8a8a8a;
    --page:      #ffffff;
    --r3:        #a12634;
    --r4:        #e88b30;
    --r1:        #4a7078;
    --r2:        #7d3a5a;
  }
  html, body { margin: 0; padding: 0; background: var(--page); color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
    font-size: 12.5px; }
  .wrap { width: 1100px; margin: 30px auto; padding: 0 40px; }
  h1 { font-size: 26px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.01em; color: var(--ink); }
  h1 em { color: var(--r3); font-style: normal; }
  .subtitle { font-size: 13px; color: var(--ink-2); margin: 0 0 24px; }
  svg { display: block; margin: 0 auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>4 Circle <em>Venn Diagram</em></h1>

  <svg viewBox="0 0 1100 700" width="1100" height="700" xmlns="http://www.w3.org/2000/svg">
    <!-- ============ OUTER RULE LABELS ============ -->
    <!-- Top-left: Rule 3 -->
    <text x="380" y="80" text-anchor="end" font-size="16" font-weight="800" fill="var(--r3)">Rule 3</text>
    <text x="380" y="102" text-anchor="end" font-size="12" font-weight="500" fill="var(--ink)">Listcode</text>
    <text x="380" y="122" text-anchor="end" font-size="10.5" fill="var(--ink-2)">Excludes shipping locations</text>
    <text x="380" y="136" text-anchor="end" font-size="10.5" fill="var(--ink-2)">with list codes in government,</text>
    <text x="380" y="150" text-anchor="end" font-size="10.5" fill="var(--ink-2)">college, distributor, and internal.</text>

    <!-- Top-right: Rule 4 -->
    <text x="720" y="80" text-anchor="start" font-size="16" font-weight="800" fill="var(--r4)">Rule 4</text>
    <text x="720" y="102" text-anchor="start" font-size="12" font-weight="500" fill="var(--ink)">Multi-billto</text>
    <text x="720" y="122" text-anchor="start" font-size="10.5" fill="var(--ink-2)">Excludes contacts who order</text>
    <text x="720" y="136" text-anchor="start" font-size="10.5" fill="var(--ink-2)">across more than one non-</text>
    <text x="720" y="150" text-anchor="start" font-size="10.5" fill="var(--ink-2)">individual billing location.</text>

    <!-- Bottom-left: Rule 1 -->
    <text x="380" y="580" text-anchor="end" font-size="16" font-weight="800" fill="var(--r1)">Rule 1</text>
    <text x="380" y="602" text-anchor="end" font-size="12" font-weight="500" fill="var(--ink)">Contact count</text>
    <text x="380" y="622" text-anchor="end" font-size="10.5" fill="var(--ink-2)">Excludes shipping locations</text>
    <text x="380" y="636" text-anchor="end" font-size="10.5" fill="var(--ink-2)">with 10 or more active</text>
    <text x="380" y="650" text-anchor="end" font-size="10.5" fill="var(--ink-2)">ordering contacts.</text>

    <!-- Bottom-right: Rule 2 -->
    <text x="720" y="580" text-anchor="start" font-size="16" font-weight="800" fill="var(--r2)">Rule 2</text>
    <text x="720" y="602" text-anchor="start" font-size="12" font-weight="500" fill="var(--ink)">Ship-to orders</text>
    <text x="720" y="622" text-anchor="start" font-size="10.5" fill="var(--ink-2)">Excludes contacts who have</text>
    <text x="720" y="636" text-anchor="start" font-size="10.5" fill="var(--ink-2)">placed fewer than 3 orders</text>
    <text x="720" y="650" text-anchor="start" font-size="10.5" fill="var(--ink-2)">at the same ship-to location.</text>

    <!-- ============ THE 4 CIRCLES ============ -->
    <g style="mix-blend-mode: multiply;">
      <circle cx="470" cy="260" r="140" fill="var(--r3)" opacity="0.92"/>
      <circle cx="630" cy="260" r="140" fill="var(--r4)" opacity="0.92"/>
      <circle cx="470" cy="410" r="140" fill="var(--r1)" opacity="0.92"/>
      <circle cx="630" cy="410" r="140" fill="var(--r2)" opacity="0.92"/>
    </g>

    <!-- ============ REGION NUMBERS (white text inside circles) ============ -->
    <!-- Rule 3 only (outer top-left) -->
    <text x="410" y="215" text-anchor="middle" font-size="18" font-weight="800" fill="white">787K</text>
    <text x="410" y="232" text-anchor="middle" font-size="10" fill="white" opacity="0.9">R3 only</text>

    <!-- Rule 4 only (outer top-right) -->
    <text x="690" y="215" text-anchor="middle" font-size="18" font-weight="800" fill="white">1.32M</text>
    <text x="690" y="232" text-anchor="middle" font-size="10" fill="white" opacity="0.9">R4 only</text>

    <!-- Rule 1 only (outer bottom-left) -->
    <text x="410" y="455" text-anchor="middle" font-size="18" font-weight="800" fill="white">3.32M</text>
    <text x="410" y="472" text-anchor="middle" font-size="10" fill="white" opacity="0.9">R1 only</text>

    <!-- Rule 2 only (outer bottom-right) -->
    <text x="690" y="455" text-anchor="middle" font-size="18" font-weight="800" fill="white">565K</text>
    <text x="690" y="472" text-anchor="middle" font-size="10" fill="white" opacity="0.9">R2 only</text>

    <!-- Top pair overlap: R3 ∩ R4 -->
    <text x="550" y="260" text-anchor="middle" font-size="15" font-weight="800" fill="white">82K</text>
    <text x="550" y="275" text-anchor="middle" font-size="9" fill="white" opacity="0.9">R3 ∩ R4</text>

    <!-- Bottom pair overlap: R1 ∩ R2 -->
    <text x="550" y="410" text-anchor="middle" font-size="15" font-weight="800" fill="white">149K</text>
    <text x="550" y="425" text-anchor="middle" font-size="9" fill="white" opacity="0.9">R1 ∩ R2</text>

    <!-- Left pair overlap: R3 ∩ R1 -->
    <text x="470" y="335" text-anchor="middle" font-size="15" font-weight="800" fill="white">208K</text>
    <text x="470" y="350" text-anchor="middle" font-size="9" fill="white" opacity="0.9">R3 ∩ R1</text>

    <!-- Right pair overlap: R4 ∩ R2 -->
    <text x="630" y="335" text-anchor="middle" font-size="15" font-weight="800" fill="white">59K</text>
    <text x="630" y="350" text-anchor="middle" font-size="9" fill="white" opacity="0.9">R4 ∩ R2</text>

    <!-- Center: all 4 overlap -->
    <text x="550" y="336" text-anchor="middle" font-size="14" font-weight="800" fill="white">435K</text>
    <text x="550" y="350" text-anchor="middle" font-size="9" fill="white" opacity="0.9">3+ rules</text>
  </svg>

</div>
</body>
</html>
